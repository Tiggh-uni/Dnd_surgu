<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Квест генератор для D&D (работает на iPhone)</title>
    <style>
        * {
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background: #d9cdb0;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 1rem;
        }
        .container {
            max-width: 700px;
            margin: 0 auto;
            background: #fffaf3;
            border-radius: 32px;
            padding: 1.5rem;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
        }
        button {
            background: #2c2b26;
            color: #f0e4c2;
            border: none;
            padding: 14px 28px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 60px;
            width: 100%;
            cursor: pointer;
            touch-action: manipulation;
            transition: 0.1s linear;
            font-family: inherit;
        }
        button:active {
            transform: scale(0.97);
            background: #4a463b;
        }
        .quest {
            margin-top: 24px;
        }
        .category {
            background: #fef7e8;
            margin: 16px 0;
            padding: 12px 18px;
            border-radius: 20px;
            border-left: 6px solid #ac8e5c;
        }
        .cat-name {
            font-weight: 800;
            text-transform: uppercase;
            font-size: 0.8rem;
            color: #745f3c;
            letter-spacing: 1px;
        }
        .dice {
            background: #ddd0b6;
            padding: 2px 8px;
            border-radius: 30px;
            font-size: 0.7rem;
            font-weight: bold;
            margin-left: 8px;
        }
        hr {
            margin: 20px 0;
            border-top: 2px dotted #cbb982;
        }
        details {
            background: #efe3cf;
            padding: 12px 18px;
            border-radius: 20px;
            font-size: 0.9rem;
        }
        summary {
            font-weight: bold;
            cursor: pointer;
        }
        ul, li {
            margin: 6px 0;
        }
    </style>
</head>
<body>
<div class="container">
    <h2>🌾 Абстрактный генератор квестов</h2>
    <p><em>Без конкретных имён и существ. Бросаем d12 для каждого пункта.</em></p>
    <button id="generateBtn" type="button">✨ Сгенерировать квест (d12 ×6)</button>
    <div id="questResult" class="quest"></div>
    <hr>
    <details>
        <summary>📜 Таблицы для ручного броска d12</summary>
        <div id="manualTables"></div>
    </details>
</div>

<script>
    // ========= ТАБЛИЦЫ (полностью абстрактные) =========
    const tables = {
        инициатор: [
            "Сущность, чьё существование зависит от нестабильного равновесия двух противоположных сил.",
            "Носитель знания, которое не может быть передано прямо, только через цепь событий.",
            "Фрагмент разрушенного целого, стремящийся восстановить связь с другими фрагментами.",
            "Точка бифуркации — выбор, который когда-то не сделали, теперь давит на реальность.",
            "Эхо прошлого действия, не имеющее воли, но порождающее повторяющиеся паттерны.",
            "Система правил, нарушение которых вызывает ответный импульс (инициатор — сама структура).",
            "Пустота, образованная отсутствием того, что должно было существовать.",
            "Агент без идентичности — его роль определяет первый, кто с ним взаимодействует.",
            "Контейнер для чужой судьбы, временно удерживающий её, пока владелец ищет замену.",
            "Существо из параллельного исхода — оно существует только если определённое событие НЕ случилось.",
            "Архитектор ловушки, которая поймала его самого — теперь он ищет внешнее вмешательство.",
            "Нематериальный долг — кто-то обязан совершить действие, но забыл кому и зачем."
        ],
        действие: [
            "Соединить две изолированные системы, чтобы они нейтрализовали взаимные искажения.",
            "Извлечь стабильный объект из зоны, где причинность работает с задержкой.",
            "Следовать маршруту, который определяется не пространством, а последовательностью нарушенных правил.",
            "Прервать цикл, где каждое завершение автоматически запускает начало.",
            "Передать сообщение через среду, искажающую смысл (каждая передача меняет его).",
            "Зафиксировать текущее состояние системы, которое постепенно расплывается как клякса.",
            "Удалить один из вариантов будущего, чтобы остальные стали возможны.",
            "Создать артефакт, который будет действовать только после разрушения своего создателя.",
            "Одновременно присутствовать в нескольких точках вероятности, не коллапсируя их.",
            "Заставить конфликтующие законы локальной реальности занять одну территорию без взрыва.",
            "Скопировать свойство из одной сущности в другую, не уничтожая исходную.",
            "Выполнить условие, которое никто не может запомнить дольше нескольких минут."
        ],
        среда: [
            "Область, где каждое действие порождает эхо в виде второстепенного противоположного эффекта.",
            "Пространство с неевклидовой метрикой — ближайший путь не является кратчайшим.",
            "Слой реальности, где физические объекты имеют приоритет над живыми, и наоборот.",
            "Территория, разделённая на зоны разных темпоральных скоростей.",
            "Место, где память о событиях становится физическим ландшафтом (холмы — воспоминания).",
            "Система зеркал, отражающих не свет, а намерения — каждый видит чужие цели.",
            "Пустота, в которой границы определяются уровнем внимания наблюдателя.",
            "Среда, где отсутствует один фундаментальный закон (например, нет трения или нет случайности).",
            "Лабиринт, построенный из чужих снов — они не подчиняются единой логике.",
            "Статический шум между каналами реальности — там можно услышать неслучившееся.",
            "Зона, инфицированная избыточной причинностью — у каждого следствия тысячи причин.",
            "Платформа, балансирующая между двумя разными наборами физики — переход резок."
        ],
        оппонент: [
            "Структура, поддерживающая текущее состояние хаоса как равновесие — любое изменение делает хуже.",
            "Сущность, которая не может проиграть, но и не может победить — только затягивать время.",
            "Рой микро-агентов, каждый действует случайно, но суммарно создаёт направленное сопротивление.",
            "Автоматический защитник, не различающий добро и зло — только нарушителей протокола.",
            "Паразит, питающийся не материей, а причинно-следственными связями.",
            "Копия инициатора, порождённая искажением первого шага квеста.",
            "Живое уравнение — оппонент является математической функцией, искажающей входные данные.",
            "Существо, чья форма и свойства зависят от абстрактных страхов наблюдателя (страх неизвестности, потери контроля).",
            "Нейтральная сила, которая просто выполняет контракт, заключённый неизвестно кем.",
            "Маска без лица — принимает любую роль, необходимую для остановки изменений.",
            "Аномалия, которая не атакует, а замедляет, усложняет, запутывает — без враждебности.",
            "Коллективный разум, голосующий за каждое действие — решение принимается с задержкой."
        ],
        поворот: [
            "Реальная цель противоположна заявленной — и инициатор этого не знает (информация искажена).",
            "Каждое успешно выполненное действие усиливает сопротивление оппонента (обратная связь).",
            "Среди участников квеста есть элемент, который на самом деле является частью среды.",
            "Финал квеста уже предопределён, но его можно изменить, только нарушив условия старта.",
            "Инициатор и оппонент — две половины одного целого, не знающие об этом.",
            "Никто не хочет результата, все действуют по инерции — отмена квеста тоже опасна.",
            "Среда сама выбирает, кто станет оппонентом, исходя из морального выбора группы.",
            "Награда существует, но после получения она меняет приоритеты персонажей на противоположные.",
            "Временная петля скрыта — группа уже проходила этот квест, но память стёрта.",
            "Третий игрок скрыт — всё происходящее — тест для другого наблюдателя, не для группы.",
            "Условие успеха — не выполнить действие, а убедить всех, что оно выполнено (иллюзия результата).",
            "В конце квест сам выбирает, кто из группы получит опыт, а кто — проклятие, по неизвестному правилу."
        ],
        вознаграждение: [
            "Возможность один раз переопределить одно локальное правило реальности (например, «здесь не работает гравитация»).",
            "Доступ к скрытому каналу информации, где будущее обсуждается в прошедшем времени.",
            "Право задать один вопрос, на который ответит сама структура мироздания (не существо).",
            "Небольшой фрагмент стабильности — его можно вставить в любую аномалию, чтобы заморозить.",
            "Ключ от закрытой комнаты, которой не существует, пока вы его не используете.",
            "Эхо успеха — в критический момент у вас есть шанс повторить удачное действие из прошлого.",
            "Переходник между классами реальности — вы можете на 1 минуту видеть невидимые связи.",
            "Титул, который автоматически признается любой системой, но не даёт материальных прав.",
            "Способность на время «забыть» одно из правил мира (отключить трение, инерцию и т.п.).",
            "Контракт с самим квестом — в будущем вы можете отказаться от любого другого квеста без пени.",
            "Сфера с уменьшенной копией пройденной аномалии — можно использовать как одноразовую ловушку.",
            "Право изменить одну деталь прошлого, не влияющую на основные события (цвет флага, имя третьестепенного духа)."
        ]
    };

    function rollDie(sides) {
        return Math.floor(Math.random() * sides) + 1;
    }

    function generateQuest() {
        const order = ['инициатор', 'действие', 'среда', 'оппонент', 'поворот', 'вознаграждение'];
        let html = '';
        for (let key of order) {
            const list = tables[key];
            const roll = rollDie(list.length);
            const value = list[roll-1];
            html += `
                <div class="category">
                    <span class="cat-name">🌀 ${key.toUpperCase()}</span>
                    <span class="dice">d${list.length} → ${roll}</span>
                    <div style="margin-top: 8px;">${value}</div>
                </div>
            `;
        }
        document.getElementById('questResult').innerHTML = html;
    }

    function buildManualTables() {
        let html = '';
        for (let [cat, opts] of Object.entries(tables)) {
            html += `<h4>${cat.toUpperCase()} (d${opts.length})</h4><ul>`;
            opts.forEach((opt, idx) => {
                html += `<li><strong>${idx+1}:</strong> ${opt}</li>`;
            });
            html += `</ul>`;
        }
        document.getElementById('manualTables').innerHTML = html;
    }

    // Назначаем событие и на touchstart, и на click для надёжности на iOS
    const btn = document.getElementById('generateBtn');
    function onGenerate(e) {
        e.preventDefault();
        generateQuest();
    }
    btn.addEventListener('click', onGenerate);
    btn.addEventListener('touchstart', onGenerate, { passive: false });

    // Предзаполним для примера
    generateQuest();
    buildManualTables();
</script>
</body>
</html>
